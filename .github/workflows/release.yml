name: Release

# Builds the macOS app and publishes it as a GitHub Release.
#
# Runs on macOS because codesign (used by scripts/afterPack.cjs) and the dmg
# builder only exist there. Push a version tag to release:
#   git tag v0.3.0 && git push origin v0.3.0
#
# Run manually from the Actions tab (workflow_dispatch) to get the build as a
# workflow artifact without cutting a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    # macos-14 is Apple Silicon, matching the arm64 target in
    # electron-builder.yml. Pinned rather than macos-latest so the runner
    # architecture cannot drift away from the target.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json would publish a release whose
      # binary reports a different version internally.
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm run typecheck

      # --publish never: electron-builder otherwise tries to publish on its
      # own when it detects CI, and the release is created explicitly below.
      # Auto-discovery is off so it never picks up a certificate; signing is
      # scripts/afterPack.cjs's job (ad-hoc, see electron-builder.yml).
      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-vite build && npx electron-builder --mac --publish never

      # Checked after packaging because afterPack verifies the bundle before
      # electron-builder zips it. The zip is verified separately: an archiver
      # that drops symlinks or xattrs yields an app whose signature is broken
      # only once extracted, which is exactly what users would download.
      # The directory is mac or mac-arm64 depending on host arch, so find it.
      - name: Verify code signatures
        run: |
          APP=$(find release -maxdepth 2 -name 'Karakeep.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No Karakeep.app found under release/" >&2
            find release -maxdepth 2 >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

          ZIP=$(ls release/*.zip | head -1)
          EXTRACT=$(mktemp -d)
          ditto -x -k "$ZIP" "$EXTRACT"
          codesign --verify --deep --strict --verbose=2 "$EXTRACT/Karakeep.app"

          # Expected to fail: the build is not notarized. Reported for the log only.
          spctl --assess --type execute --verbose "$EXTRACT/Karakeep.app" || true

      # Bare filenames, so `shasum -a 256 -c SHA256SUMS.txt` works from the
      # directory the user downloaded into.
      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Karakeep-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

          Download **\`Karakeep-$VERSION-arm64.dmg\`**, open it, drag Karakeep to Applications.

          The build is **not notarized**, so the first launch needs one extra step:

          > **Right-click the app → Open**, then confirm.

          Double-clicking it the normal way shows no Open button. You only have to do this once.

          Prefer the terminal? \`xattr -dr com.apple.quarantine /Applications/Karakeep.app\`

          **Apple Silicon only.** Intel Macs are not built for.

          ## Verifying the download

          \`shasum -a 256 -c SHA256SUMS.txt\` next to the downloaded files.

          NOTES
          gh release create "$GITHUB_REF_NAME" \
            release/*.dmg release/*.zip release/SHA256SUMS.txt \
            --title "Karakeep for macOS $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
