appId: com.karakeep.desktop
productName: Karakeep
directories:
  output: release
  buildResources: build-resources
files:
  - out/**/*
  - package.json
  # Never ship dev credentials or verification artifacts.
  - '!.env.local'
  - '!tmp-screenshots/**'
  - '!reference/**'
  - '!scripts/**'
  - '!src/**'
  # The renderer is bundled into out/renderer, so its dependencies (react,
  # tanstack, the whole @embedpdf tree and its pdfium wasm) are already in
  # there — shipping node_modules as well doubled the asar to 190 MB for a
  # second, unused copy. Only what the *main* bundle requires at runtime
  # needs to survive; electron-vite externalizes those rather than inlining
  # them, and today that list is exactly zod.
  - '!node_modules/**'
  - 'node_modules/zod/**'
mac:
  # Generated by scripts/make-icon.mjs. electron-builder would find this by
  # convention inside buildResources; naming it means a rename fails the
  # build instead of silently shipping Electron's default icon.
  icon: build-resources/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  # No Developer ID account, and the only certificates on this machine are
  # "Apple Development" ones — those are for running on registered devices
  # and would produce a build that launches nowhere else. So electron-
  # builder does not sign, and scripts/afterPack.cjs re-signs ad-hoc
  # instead. See that file: skipping signing altogether ships a bundle
  # macOS calls "damaged" and refuses to open at all.
  identity: null
  # Hardened runtime is for notarized builds and needs entitlements to let
  # V8 JIT; switching it on under an ad-hoc signature crashes the app on
  # launch instead of protecting anything.
  hardenedRuntime: false
  # Skips a Gatekeeper assessment that is guaranteed to fail for an
  # un-notarized build and would abort the packaging step.
  gatekeeperAssess: false
afterPack: scripts/afterPack.cjs
artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  title: ${productName} ${version}
